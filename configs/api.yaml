api:
  title: "GeoSentinel AI"
  description: "Cloud-native geospatial analytics platform for urban expansion and vegetation dynamics monitoring."
  version: "1.0.0"
  prefix: "/api/v1"

cors:
  allow_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allow_credentials: true
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - "*"

server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

job:
  max_concurrent: 3
  timeout_seconds: 1800
  cleanup_after_hours: 24