project:
  name: "GeoSentinel AI"
  version: "1.0.0"
  author: "Karthikeya Bhamidipati"
  description: "GeoAI Decision Support Platform"

study_area:
  name: "Hyderabad Metropolitan Region"
  country: "India"
  buffer_km: 150

coordinate_system:
  epsg: 4326
  projection: "WGS84"

data:
  provider: "local_safe"
  cache_enabled: true
  cache_directory: "data/raw/cache"

sentinel:
  mission: "Sentinel-2"
  processing_level: "L2A"
  spatial_resolution: 10
  cloud_cover_threshold: 10

bands:
  rgb:
    - B04
    - B03
    - B02

  false_color:
    - B08
    - B04
    - B03

  analysis:
    - B02
    - B03
    - B04
    - B08

indices:
  compute:
    - NDVI
    - NDBI
    - NDWI
    - EVI
    - SAVI
    - MSAVI
    - BSI

preprocessing:
  normalize: true
  resample_resolution: 10
  clip_to_aoi: true
  nodata_value: 0

dataset:
  patch_size: 256
  stride: 128
  train_split: 0.70
  validation_split: 0.15
  test_split: 0.15

training:
  model: "unet"
  epochs: 100
  batch_size: 8
  learning_rate: 0.0001
  optimizer: "Adam"

benchmark:
  datasets:
    - OSCD
    - S2Looking

output:
  save_geotiff: true
  save_png: true
  save_geojson: true
  save_pdf: true

logging:
  level: "INFO"
  save_logs: true
  log_directory: "outputs/logs"

docker:
  enabled: false