version: 1

disable_existing_loggers: false

formatters:

  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(module)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:

  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: outputs/logs/geosentinel.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:

  GeoSentinel:
    level: DEBUG
    handlers:
      - console
      - file
    propagate: false

  uvicorn:
    level: INFO
    handlers:
      - console
    propagate: false

  uvicorn.error:
    level: INFO
    propagate: true

  uvicorn.access:
    level: INFO
    handlers:
      - console
    propagate: false

root:
  level: WARNING
  handlers:
    - console