

services:
  # ==========================================
  # FastAPI Backend
  # ==========================================
  backend:
    image: karthikeya/geosentinal_25070243008:backend
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: geosentinel_backend
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs
    expose:
      - "8000"

  # ==========================================
  # Next.js Frontend
  # ==========================================
  frontend:
    image: karthikeya/geosentinal_25070243008:frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: geosentinel_frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    expose:
      - "3000"

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: geosentinel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
