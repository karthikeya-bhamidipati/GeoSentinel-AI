
services:
  # ==========================================
  # FastAPI Backend
  # ==========================================
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: geosentinel_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ../data:/app/data
      - ../configs:/app/configs
      - ../outputs:/app/outputs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==========================================
  # Next.js Frontend
  # ==========================================
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: geosentinel_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://nginx/api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: geosentinel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  data:
  outputs:
